name: Unity CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Unity Builder
    runs-on: [self-hosted, unity]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0  # Required for semantic versioning to access full git history
      - name: Cache Unity packages
        uses: actions/cache@v4
        with:
          path: Library/PackageCache
          key: ${{ runner.os }}-unity-packages-${{ hashFiles('Packages/manifest.json') }}
      - name: Run Unity Builder (GameCI)
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: 6000.2.5f1
          targetPlatform: StandaloneWindows64
          versioning: Semantic  # Use 'Custom' + customVersion if you want to avoid git history requirements
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-StandaloneWindows64
          path: build/StandaloneWindows64