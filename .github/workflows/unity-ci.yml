name: Unity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Unity Builder
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [StandaloneWindows64, StandaloneLinux64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install git-lfs -y
          git lfs install

      - name: Cache Unity packages (optional)
        uses: actions/cache@v4
        with:
          path: Library/PackageCache
          key: ${{ runner.os }}-unity-packages-${{ hashFiles('Packages/manifest.json') }}

      - name: Run Unity Builder (GameCI)
        uses: game-ci/unity-builder@v3
        with:
          projectPath: .
          unityVersion: 6000.2.5f1 # detected from ProjectSettings/ProjectVersion.txt
          targetPlatform: ${{ matrix.target }}
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build
          path: build/**

  # Notes:
  # - This workflow uses your Unity account email and password for CI activation (Personal license).
  # - No serial or license file is needed for Personal license activation.
  # - Store your credentials only in GitHub Secrets, never in the repo.
  # - `unityVersion` uses the detected editor version from `ProjectSettings/ProjectVersion.txt`.
  # - Adjust `targetPlatform` matrix or remove matrix if only a single platform is required.
