name: Unity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Unity Builder
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [StandaloneWindows64, StandaloneLinux64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install git-lfs -y
          git lfs install

      - name: Cache Unity packages (optional)
        uses: actions/cache@v4
        with:
          path: Library/PackageCache
          key: ${{ runner.os }}-unity-packages-${{ hashFiles('Packages/manifest.json') }}

      - name: Run Unity Builder (GameCI)
        uses: game-ci/unity-builder@v3
        with:
          projectPath: .
          unityVersion: 6000.2.5f1 # detected from ProjectSettings/ProjectVersion.txt
          targetPlatform: ${{ matrix.target }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }} # recommend storing the license file content in this secret

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build
          path: build/**

  # Notes:
  # - This workflow expects the `UNITY_LICENSE` repository secret to contain the Unity license file
  #   content (Base64 or raw) and `game-ci/unity-builder` will use it to activate the editor.
  # - `unityVersion` uses the detected editor version from `ProjectSettings/ProjectVersion.txt`.
  # - Adjust `targetPlatform` matrix or remove matrix if only a single platform is required.
